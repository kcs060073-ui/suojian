name: Reference workbench checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reference-workbench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install main dependencies
        run: python -m pip install -r main/requirements.txt
      - name: Test offline analysis adapters
        working-directory: main
        env:
          PYTHONUTF8: '1'
        run: python -m unittest tests.test_production_methods tests.test_speech_text_policy tests.test_video_link tests.test_platform_video tests.test_segmented_video
      - name: Check workbench JavaScript
        shell: pwsh
        run: |
          $files = @('workbench.js','workspace.js','unified.js','analysis-preview.js','production-methods.js','timeline-navigation.js')
          foreach ($name in $files) {
            node --check "main/suo_jian/ui/static/$name"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test Windows setup detection without installation
        shell: powershell
        run: .\tests\test-setup-tools.ps1
