name: Reference workbench checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reference-workbench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install main dependencies
        run: python -m pip install -r main/requirements.txt
      - name: Install FFmpeg for real video fixtures
        shell: pwsh
        env:
          FFMPEG_VERSION: '8.1.2'
          # SHA-256 from the Gyan.FFmpeg 8.1.2 winget installer manifest.
          FFMPEG_SHA256: B8CDEFAB5F50590A076C27C2B56B0294A0E6154FADED28BA1BA05EBC4F801F57
        run: |
          $build = "ffmpeg-$env:FFMPEG_VERSION-full_build"
          $archive = Join-Path $env:RUNNER_TEMP "$build.zip"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/$build.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $env:FFMPEG_SHA256) {
            throw "FFmpeg archive SHA-256 verification failed."
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $ffmpegBin = Join-Path $env:RUNNER_TEMP "$build/bin"
          $ffmpegBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify FFmpeg on PATH
        shell: pwsh
        run: |
          foreach ($tool in @('ffmpeg', 'ffprobe')) {
            & $tool -version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test offline analysis adapters
        working-directory: main
        env:
          PYTHONUTF8: '1'
        run: python -m unittest tests.test_public_presentation tests.test_production_methods tests.test_speech_text_policy tests.test_video_link tests.test_platform_video tests.test_platform_pages tests.test_segmented_video tests.test_presenter tests.test_presenter_sentences
      - name: Check workbench JavaScript
        shell: pwsh
        run: |
          $files = @('workbench.js','workspace.js','unified.js','analysis-preview.js','production-methods.js','timeline-navigation.js')
          foreach ($name in $files) {
            node --check "main/suo_jian/ui/static/$name"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test storyboard script and video inputs
        working-directory: vibe
        env:
          PYTHONUTF8: '1'
        run: |
          python -m unittest tests.test_script_import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check workbench/static/storyboard-studio.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_video_frames.js
      - name: Test Windows setup detection without installation
        shell: powershell
        run: .\tests\test-setup-tools.ps1
