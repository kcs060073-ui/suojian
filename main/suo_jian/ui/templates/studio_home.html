<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>溯剪 · 制作工作台</title><link rel="icon" href="/static/suojian-icon.png"><link rel="stylesheet" href="/static/studio-home.css"></head>
<body class="suojian-app page-home">{% include '_studio_nav.html' %}
<main id="appMain" class="studio-home">
  <section class="home-intro"><h1>新建视频</h1></section>
  <section aria-label="选择制作方向" class="mode-grid">
    <a class="mode-card mode-feed" href="/?studio=feed"><div class="entry-art art-film" aria-hidden="true"><div class="reel"><i></i><i></i><i></i></div></div><div class="mode-copy"><h2>参考片复刻</h2><span class="entry-arrow" aria-hidden="true">›</span></div></a>
    <a class="mode-card mode-presenter" href="/presenter"><div class="entry-art art-voice" aria-hidden="true"><div class="wave"><i style="--amplitude:8px"></i><i style="--amplitude:14px"></i><i style="--amplitude:23px"></i><i style="--amplitude:15px"></i><i style="--amplitude:31px"></i><i style="--amplitude:39px"></i><i style="--amplitude:24px"></i><i style="--amplitude:12px"></i><i style="--amplitude:20px"></i><i style="--amplitude:30px"></i><i style="--amplitude:16px"></i><i style="--amplitude:9px"></i></div></div><div class="mode-copy"><h2>真人口播</h2><span class="entry-arrow" aria-hidden="true">›</span></div></a>
    <a class="mode-card mode-vibe" href="/motion"><div class="entry-art art-boards" aria-hidden="true"><div class="frames"><i></i><i></i><i></i></div></div><div class="mode-copy"><h2>分镜创作</h2><span class="entry-arrow" aria-hidden="true">›</span></div></a>
  </section>
  <section class="recent-section" aria-labelledby="recentHeading"><div class="recent-heading"><div><h2 id="recentHeading">最近项目<span id="projectCount"></span></h2></div><label class="home-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="projectSearch" type="search" aria-label="搜索最近项目" placeholder="搜索项目名称或编号"></label></div>
  <div class="recent-filters" role="group" aria-label="按制作方向筛选"><button type="button" data-filter="all" aria-pressed="true">全部项目</button><button type="button" data-filter="feed" aria-pressed="false">园区信息流</button><button type="button" data-filter="presenter" aria-pressed="false">真人口播</button><button type="button" data-filter="vibe" aria-pressed="false">VibeCraft</button></div>
  <div id="recentProjects" class="recent-projects" aria-live="polite"><div class="home-empty">正在读取本机项目…</div></div><button type="button" id="moreProjects" class="more-projects" hidden>查看更多项目 ↓</button></section>

</main><script src="/static/studio-home.js"></script></body></html>
