<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型与 API · 溯剪</title><link rel="icon" href="/static/suojian-icon.png"><link rel="stylesheet" href="/static/model-settings.css"></head>
<body class="suojian-app page-settings">{% include '_studio_nav.html' %}<main id="appMain"><div class="intro"><h1>模型设置</h1></div>
<div id="notice" class="notice" role="status">正在读取本机配置…</div>

<div class="columns"><section><h2>已配置的模型</h2><p class="hint">生成前请验证连接和模型权限。</p><div id="profiles" class="list"></div><div class="bind"><label for="vibe-profile">VibeCraft 旧版文字导演使用</label><div><select id="vibe-profile"><option value="">保留原有导演配置</option></select><button id="bind" type="button">保存选择</button></div><small>只保存模型引用，原导演配置不删除；当前分镜创作仍由对话协助。</small></div></section>
<section><h2>管理模型服务</h2><details class="settings-form"><summary>添加模型服务</summary><p class="hint">密钥由本机安全凭据保管，不显示在列表或任务中。</p><form id="account-form"><label>服务名称<input name="name" required placeholder="例如：我的火山方舟"></label><label>服务类型<select name="preset"><option value="volcengine_ark">火山方舟 · 文字</option><option value="volcengine_seedance">火山方舟 · 视频</option><option value="doubao_tts">豆包 · 配音</option><option value="openai_compatible">OpenAI 兼容接口</option><option value="new_api">New API</option></select></label><label id="resource-label" hidden>配音服务版本<select name="ttsResourceId"><option value="seed-tts-1.0">豆包语音合成 1.0</option><option value="seed-tts-2.0">豆包语音合成 2.0</option></select></label><label>接口地址（选填）<input name="baseUrl" placeholder="留空使用该服务默认地址"></label><label>API 密钥<input type="password" name="secret" autocomplete="new-password" required></label><button type="submit">保存服务</button></form></details><details class="settings-form"><summary>添加能力配置</summary><form id="profile-form"><label>所属服务<select name="accountId" id="account-select" required></select></label><label>用途<select name="capability"><option value="planning">文字策划</option><option value="broll">视频生成</option><option value="tts">配音</option></select></label><label>配置名称<input name="displayName" required placeholder="例如：策划模型"></label><label id="model-label">模型标识<input name="model" required placeholder="填写服务商提供的模型名称"></label><div id="voice-controls" hidden><button id="load-voices" type="button">读取已保存音色</button> <button id="refresh-voices" type="button">联网刷新音色</button><label>默认音色<select name="defaultVoiceId" id="voice-select"></select></label><small>联网刷新会连接配音服务；请先在服务商侧开通权限。</small></div><label class="check"><input type="checkbox" name="isDefault"> 设为该用途的默认配置</label><button type="submit">添加配置</button></form></details><p class="hint">已有豆包配音与音色继续保留；旧版凭据及高级管理仍可在原设置中维护。</p></section></div>
</main><script src="/static/model-settings.js"></script></body></html>
